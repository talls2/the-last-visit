<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Last Visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; background: #000; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'VT323', ui-monospace, monospace; color: #d8d0c0;
    user-select: none; -webkit-user-select: none;
  }
  #screen { position: relative; width: 640px; height: 480px; background: #000; overflow: hidden; touch-action: none; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-size: var(--fs, 20px); }

  #label {
    position: absolute; top: 4%; left: 0; right: 0; text-align: center;
    color: #c9bfa6; text-shadow: 2px 2px 0 #000; letter-spacing: .06em; text-transform: uppercase; font-size: .9em;
  }
  #msg {
    position: absolute; bottom: 5%; left: 7%; right: 7%; text-align: center; line-height: 1.1;
    color: #ebe3cf; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; opacity: 0; transition: opacity .2s;
  }
  #msg.show { opacity: 1; }
  #msg.voice { color: #d0533f; letter-spacing: .04em; }
  #inv { position: absolute; top: 3%; right: 2.5%; display: flex; gap: .3em; }
  .slot {
    width: 2em; height: 2em; background: rgba(8, 6, 5, .7) center/80% no-repeat; border: 2px solid #3b342b;
    image-rendering: pixelated; transition: border-color .4s, box-shadow .4s;
  }
  .slot.new { border-color: #c9a85a; box-shadow: 0 0 .6em rgba(201, 168, 90, .6); }

  #center {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 1.5em; padding: 0 10%; opacity: 0; transition: opacity 1.2s;
  }
  #center.show { opacity: 1; }

  #title {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.15) 0%, rgba(0,0,0,.85) 75%);
    transition: opacity 1.2s;
  }
  #title.hide { opacity: 0; }
  #title h1 {
    margin: 0; font-weight: normal; font-size: 3.4em; white-space: nowrap; letter-spacing: .14em; color: #b8ae9a;
    text-shadow: 3px 3px 0 #000, 0 0 .4em rgba(160, 30, 20, .5);
  }
  #title .sub { color: #7d7466; margin-top: .2em; letter-spacing: .1em; }
  #title .start { margin-top: 2.2em; color: #d8d0c0; }
  #title .hint { position: absolute; bottom: 5%; color: #6b6356; font-size: .8em; text-align: center; line-height: 1.3; }

  #ending {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: .9em; text-align: center; padding: 0 10%; background: #000;
  }
  #ending.show { display: flex; }
  #ending .line { opacity: 0; transition: opacity 2s; font-size: 1.15em; }
  #ending .line.in { opacity: 1; }
  #ending .big { font-size: 2.6em; letter-spacing: .14em; color: #a33b2c; margin-top: .6em; }
  #ending .dim { color: #6b6356; }
  .blink { animation: blink 1.4s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
</style>
</head>
<body>
<div id="screen">
  <canvas id="game" width="320" height="240"></canvas>
  <div id="ui">
    <div id="label"></div>
    <div id="msg"></div>
    <div id="inv"></div>
    <div id="center"></div>
    <div id="title">
      <h1>THE LAST VISIT</h1>
      <div class="sub">a short horror</div>
      <div class="start blink">click to enter</div>
      <div class="hint">headphones recommended<br>click to look &amp; move · screen edges to turn · WASD / arrows also work</div>
    </div>
    <div id="ending"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.min.js"></script>
</body>
</html>
